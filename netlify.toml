# netlify.toml
[build]
  # Static Nuxt generate build. Netlify will serve from dist.
  command = "npm run generate"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Configure secrets scanning to omit output directory and README
  # These contain public Supabase URLs needed for client-side connection
  SECRETS_SCAN_OMIT_PATHS = "dist/**,README.md"
  
# SPA fallback for client routes not present as static HTML (e.g. /admin/users/:id).
# Existing files (/, /admin/index.html, assets) still win; only missing paths use 200.html.
[[redirects]]
  from = "/*"
  to = "/200.html"
  status = 200

# Hashed JS/CSS can be cached forever. More specific rules below override this.
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

# latest.json changes every deploy — never treat it as immutable.
# Caching it for a year leaves Chrome on a deleted build (login works in incognito only).
[[headers]]
  for = "/_nuxt/builds/latest.json"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"

# Old build meta 404s must not be stored as immutable.
[[headers]]
  for = "/_nuxt/builds/meta/*"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/auth/*"
  [headers.values]
    cache-control = "no-store, max-age=0"

# Netlify functions in netlify/functions/
# - nfc-list-products.mjs / nfc-create-order.mjs
# - tag-ensure.mjs / tag-record-scan.mjs / tag-report-found.mjs
#
# Found-dog SMS (Twilio) — purchased UK number:
#   TWILIO_ACCOUNT_SID=ACxxxx   (NOT SKxxxx)
#   TWILIO_AUTH_TOKEN=...
#   TWILIO_FROM_NUMBER=+447888871736
#   TWILIO_USE_TRIAL_TEMPLATE=false
# Unsplash — server-side for /.netlify/functions/unsplash-image
# UNSPLASH_ACCESS_KEY=...
# Mapbox (scan map): NUXT_PUBLIC_MAPBOX_TOKEN
# Care actions: tag-care-action.mjs (check in/out, walk start/end — no SMS)
# Classifieds guest contact: /.netlify/functions/classifieds-contact → doghealthy_messages inbox
# Community members: /.netlify/functions/members?page=1&pageSize=20
# Stripe subscribe: create-subscription-checkout + confirm-subscription (+ optional stripe-webhook)
#   LIVE: STRIPE_MODE=live + STRIPE_SECRET_KEY=sk_live_… + NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_live_…
#   TEST: STRIPE_MODE=test + sk_test_… / pk_test_…
#   Check: GET /.netlify/functions/stripe-mode  → mode should be "live"
#   NUXT_PUBLIC_BASE_URL=https://doghealthy.co.uk
#   After changing Stripe env vars: Trigger deploy → Clear cache and deploy site
# Admin dashboard: /admin (prerendered) + SPA fallback via /200.html for nested routes

